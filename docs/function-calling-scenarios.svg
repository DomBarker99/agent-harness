<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="850" fill="#ffffff"/>

  <!-- Title -->
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Function calling: the 3 response scenarios</text>
  <text x="520" y="52" text-anchor="middle" font-size="13" fill="#666">The loop decides what to do next by looking ONLY at `tool_calls`, never at `content`.</text>

  <!-- column dividers -->
  <line x1="350" y1="68" x2="350" y2="820" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="690" y1="68" x2="690" y2="820" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ COLUMN A : Plain answer ============ -->
  <text x="175" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1976d2">A · Plain answer (no tools)</text>

  <!-- A1 -->
  <rect x="35" y="100" width="280" height="48" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="175" y="129" text-anchor="middle" font-size="13" fill="#0d47a1">User prompt</text>
  <line x1="175" y1="148" x2="175" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- A2 -->
  <rect x="35" y="180" width="280" height="48" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="175" y="209" text-anchor="middle" font-size="13" fill="#1b5e20">Model — create()</text>
  <line x1="175" y1="228" x2="175" y2="258" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- A3 -->
  <rect x="35" y="260" width="280" height="74" rx="8" fill="#f1f8e9" stroke="#689f38"/>
  <text x="175" y="280" text-anchor="middle" font-size="12.5">
    <tspan x="175" font-weight="700" fill="#33691e">Assistant message</tspan>
    <tspan x="175" dy="17" font-family="monospace" font-size="11.5" fill="#444">content: "the answer"</tspan>
    <tspan x="175" dy="15" font-family="monospace" font-size="11.5" fill="#444">tool_calls: none</tspan>
    <tspan x="175" dy="15" font-family="monospace" font-size="11.5" fill="#888">finish_reason: "stop"</tspan>
  </text>
  <line x1="175" y1="334" x2="175" y2="364" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- A4 -->
  <rect x="35" y="366" width="280" height="58" rx="8" fill="#eceff1" stroke="#607d8b"/>
  <text x="175" y="390" text-anchor="middle" font-size="12.5">
    <tspan x="175" fill="#37474f">Print answer to user,</tspan>
    <tspan x="175" dy="16" fill="#37474f">wait for next prompt</tspan>
  </text>
  <text x="175" y="455" text-anchor="middle" font-size="11.5" font-style="italic" fill="#999">1 model call. The loop exits immediately.</text>

  <!-- ============ COLUMN B : Tools then answer ============ -->
  <text x="520" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#f57c00">B · Tools, then answer  (content was null)</text>

  <!-- B1 -->
  <rect x="380" y="100" width="280" height="44" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="520" y="127" text-anchor="middle" font-size="13" fill="#0d47a1">User prompt</text>
  <line x1="520" y1="144" x2="520" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B2 -->
  <rect x="380" y="172" width="280" height="44" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="520" y="199" text-anchor="middle" font-size="13" fill="#1b5e20">Model — create()</text>
  <line x1="520" y1="216" x2="520" y2="242" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B3 -->
  <rect x="380" y="244" width="280" height="72" rx="8" fill="#fff3e0" stroke="#f57c00"/>
  <text x="520" y="264" text-anchor="middle" font-size="12.5">
    <tspan x="520" font-weight="700" fill="#e65100">Assistant message</tspan>
    <tspan x="520" dy="17" font-family="monospace" font-size="11.5" fill="#888">content: null</tspan>
    <tspan x="520" dy="15" font-family="monospace" font-size="11.5" fill="#444">tool_calls: [ … ]</tspan>
    <tspan x="520" dy="15" font-family="monospace" font-size="11.5" fill="#888">finish_reason: "tool_calls"</tspan>
  </text>
  <line x1="520" y1="316" x2="520" y2="342" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B4 -->
  <rect x="380" y="344" width="280" height="48" rx="8" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="520" y="364" text-anchor="middle" font-size="12.5">
    <tspan x="520" fill="#4a148c">Execute each tool call</tspan>
    <tspan x="520" dy="16" font-family="monospace" font-size="11" fill="#6a1b9a">your execute()</tspan>
  </text>
  <line x1="520" y1="392" x2="520" y2="418" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B5 -->
  <rect x="380" y="420" width="280" height="48" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="520" y="440" text-anchor="middle" font-size="12.5">
    <tspan x="520" fill="#795548">Append role:"tool" results</tspan>
    <tspan x="520" dy="16" fill="#795548">to messages</tspan>
  </text>
  <line x1="520" y1="468" x2="520" y2="494" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="668" y="486" text-anchor="start" font-size="10.5" font-style="italic" fill="#aaa">↺ loops</text>
  <!-- B6 -->
  <rect x="380" y="496" width="280" height="44" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="520" y="523" text-anchor="middle" font-size="13" fill="#1b5e20">Model — create()  (next turn)</text>
  <line x1="520" y1="540" x2="520" y2="566" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B7 -->
  <rect x="380" y="568" width="280" height="60" rx="8" fill="#f1f8e9" stroke="#689f38"/>
  <text x="520" y="590" text-anchor="middle" font-size="12.5">
    <tspan x="520" font-weight="700" fill="#33691e">Assistant message</tspan>
    <tspan x="520" dy="16" font-family="monospace" font-size="11.5" fill="#444">content: "the answer"</tspan>
    <tspan x="520" dy="15" font-family="monospace" font-size="11.5" fill="#888">finish_reason: "stop"</tspan>
  </text>
  <line x1="520" y1="628" x2="520" y2="654" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B8 -->
  <rect x="380" y="656" width="280" height="44" rx="8" fill="#eceff1" stroke="#607d8b"/>
  <text x="520" y="683" text-anchor="middle" font-size="12.5" fill="#37474f">Print answer to user</text>
  <text x="520" y="726" text-anchor="middle" font-size="11.5" font-style="italic" fill="#999">2+ model calls. User never sees the tool round.</text>

  <!-- ============ COLUMN C : Narration + tools ============ -->
  <text x="865" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#6a1b9a">C · Narration + tools, then answer</text>

  <!-- C1 -->
  <rect x="725" y="100" width="280" height="40" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="865" y="125" text-anchor="middle" font-size="13" fill="#0d47a1">User prompt</text>
  <line x1="865" y1="140" x2="865" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C2 -->
  <rect x="725" y="164" width="280" height="40" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="865" y="189" text-anchor="middle" font-size="13" fill="#1b5e20">Model — create()</text>
  <line x1="865" y1="204" x2="865" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C3 (the key box) -->
  <rect x="725" y="228" width="280" height="78" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="865" y="247" text-anchor="middle" font-size="12.5">
    <tspan x="865" font-weight="700" fill="#e65100">Assistant message</tspan>
    <tspan x="865" dy="16" font-family="monospace" font-size="11" fill="#444">content: "I'll check the files…"</tspan>
    <tspan x="865" dy="15" font-family="monospace" font-size="11" fill="#444">tool_calls: [ … ]</tspan>
    <tspan x="865" dy="15" font-family="monospace" font-size="11" fill="#888">finish_reason: "tool_calls"</tspan>
  </text>
  <line x1="865" y1="306" x2="865" y2="332" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C4 narration note -->
  <rect x="725" y="334" width="280" height="64" rx="8" fill="#fffde7" stroke="#fbc02d" stroke-dasharray="4 3"/>
  <text x="865" y="354" text-anchor="middle" font-size="11.5">
    <tspan x="865" fill="#827717">(optional) show the narration text.</tspan>
    <tspan x="865" dy="15" font-weight="700" fill="#bf360c">It is a statement, NOT a question —</tspan>
    <tspan x="865" dy="15" fill="#827717">the user is NOT prompted to reply.</tspan>
  </text>
  <line x1="865" y1="398" x2="865" y2="424" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C5 -->
  <rect x="725" y="426" width="280" height="42" rx="8" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="865" y="452" text-anchor="middle" font-size="12.5" fill="#4a148c">Execute each tool call</text>
  <line x1="865" y1="468" x2="865" y2="490" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C6 -->
  <rect x="725" y="492" width="280" height="42" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="865" y="518" text-anchor="middle" font-size="12.5" fill="#795548">Append role:"tool" results</text>
  <line x1="865" y1="534" x2="865" y2="556" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C7 -->
  <rect x="725" y="558" width="280" height="42" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="865" y="584" text-anchor="middle" font-size="13" fill="#1b5e20">Model — create()  (next turn)</text>
  <line x1="865" y1="600" x2="865" y2="622" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C8 -->
  <rect x="725" y="624" width="280" height="58" rx="8" fill="#f1f8e9" stroke="#689f38"/>
  <text x="865" y="646" text-anchor="middle" font-size="12.5">
    <tspan x="865" font-weight="700" fill="#33691e">Assistant message</tspan>
    <tspan x="865" dy="16" font-family="monospace" font-size="11.5" fill="#444">content: "final answer"</tspan>
    <tspan x="865" dy="15" font-family="monospace" font-size="11.5" fill="#888">finish_reason: "stop"</tspan>
  </text>
  <line x1="865" y1="682" x2="865" y2="704" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C9 -->
  <rect x="725" y="706" width="280" height="40" rx="8" fill="#eceff1" stroke="#607d8b"/>
  <text x="865" y="731" text-anchor="middle" font-size="12.5" fill="#37474f">Print final answer to user</text>

  <!-- bottom takeaway -->
  <rect x="35" y="788" width="970" height="40" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="520" y="813" text-anchor="middle" font-size="12.5" fill="#444">Exit test is always the same: <tspan font-family="monospace" fill="#c62828">if (!toolCalls?.length) return content</tspan>  —  content is shown to the user but never decides control flow.</text>
</svg>
