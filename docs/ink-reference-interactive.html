<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ink Reference</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9;
    --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --code-bg: #1f2630;
    --tag-comp: #1f6feb; --tag-hook: #8957e5; --tag-api: #bb8009; --tag-pkg: #238636; --tag-ui: #1098ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  /* Sidebar */
  aside {
    width: 240px; min-width: 240px; height: 100vh; position: sticky; top: 0;
    overflow-y: auto; background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px 0;
  }
  aside h1 { font-size: 18px; margin: 0 16px 4px; }
  aside .sub { color: var(--muted); font-size: 12px; margin: 0 16px 12px; }
  .search-wrap { padding: 0 16px 12px; }
  #search {
    width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .nav-group { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; margin: 14px 16px 4px; }
  nav a {
    display: block; padding: 4px 16px; color: var(--text); text-decoration: none;
    font-size: 14px; border-left: 2px solid transparent;
  }
  nav a:hover { background: #1c2430; border-left-color: var(--accent); }
  nav a.hidden { display: none; }
  /* Main */
  main { flex: 1; padding: 28px 36px 80px; max-width: 1000px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 22px;
  }
  .card.hidden { display: none; }
  .card h2 { margin: 0 0 2px; font-size: 22px; }
  .card h2 code { color: var(--accent); font-size: 22px; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; color: #fff;
    vertical-align: middle; margin-left: 8px; text-transform: uppercase; letter-spacing: .04em;
  }
  .tag.component { background: var(--tag-comp); }
  .tag.hook { background: var(--tag-hook); }
  .tag.api { background: var(--tag-api); }
  .tag.type { background: var(--tag-pkg); }
  .tag.package { background: var(--tag-pkg); }
  .tag.ui { background: var(--tag-ui); }
  .sig {
    display: block; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; margin: 10px 0; font-size: 13px;
    color: #e6edf3; overflow-x: auto; white-space: pre;
  }
  .desc { color: var(--text); margin: 8px 0 14px; }
  .desc.muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.name code { color: var(--green); }
  td.type code { color: #d2a8ff; font-size: 12.5px; }
  td.def code { color: var(--muted); }
  .prop-row.hidden { display: none; }
  .no-results { color: var(--muted); padding: 40px; text-align: center; display: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  a.src { color: var(--accent); font-size: 12px; text-decoration: none; }
  .count { color: var(--muted); font-size: 12px; font-weight: normal; }
  /* Clickable props with a live example */
  .prop-row.has-example td.name { cursor: pointer; }
  .prop-row.has-example td.name code::after {
    content: "▸"; color: var(--accent); font-size: 11px; margin-left: 6px;
    display: inline-block; transition: transform .12s ease; vertical-align: middle;
  }
  .prop-row.has-example.open td.name code::after { transform: rotate(90deg); }
  .prop-row.has-example td.name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .example-row > td { padding: 0 10px 14px; border-bottom: 1px solid #21262d; }
  .example-wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .example-snippet, .term {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    margin: 0; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12.5px; line-height: 1.5; white-space: pre; overflow-x: auto;
  }
  .example-snippet { background: var(--code-bg); color: #e6edf3; }
  .term { background: #000; color: var(--text); }
  .example-label { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; display: block; margin: 0 0 6px; }
  .example-col { display: flex; flex-direction: column; min-width: 0; flex: 0 1 auto; }
  .example-col.grow { flex: 1 1 320px; }
  .term .note { color: var(--muted); font-style: italic; }
  /* Component-level live example (Ink UI section) */
  .comp-example { margin: 2px 0 14px; }
  .ex-toggle {
    font: inherit; font-size: 12px; cursor: pointer; color: var(--accent);
    background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  }
  .ex-toggle:hover { border-color: var(--accent); }
  .ex-toggle.open { background: #1c2430; }
  .comp-example-body { margin-top: 12px; }
  .example-note { color: var(--muted); font-size: 11.5px; font-style: italic; display: block; margin-top: 6px; }
</style>
</head>

<aside>

</aside>
<main>

</main>

const KIND_LABEL = { component: "Components", api: "Top-level API", type: "Types", hook: "Hooks", ui: "Ink UI" };
const KIND_ORDER = ["component", "api", "type", "hook", "ui"];

function slug(name) { return name.replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase(); }

// Live examples (baked in by src/gen-examples.tsx). Canonical key = entry name
// with <>() stripped + "." + the prop's first token (handles "paddingX / paddingY").
const EXAMPLES = window.EXAMPLES || {};
function exampleKey(entryName, propName) {
  return entryName.replace(/[<>()]/g, "").trim() + "." + propName.split(/[ /]/)[0];
}

// Build nav (grouped) + cards
const nav = document.getElementById("nav");
const cards = document.getElementById("cards");

for (const kind of KIND_ORDER) {
  const items = DATA.filter(d => d.kind === kind);
  if (!items.length) continue;
  const grp = document.createElement("div");
  grp.className = "nav-group"; grp.textContent = KIND_LABEL[kind];
  nav.appendChild(grp);
  for (const d of items) {
    const a = document.createElement("a");
    a.href = "#" + slug(d.name); a.textContent = d.name;
    a.dataset.key = (d.name + " " + d.import + " " + d.desc).toLowerCase();
    nav.appendChild(a);
  }
}

for (const d of DATA) {
  const card = document.createElement("section");
  card.className = "card"; card.id = slug(d.name);
  const haystack = (d.name + " " + d.import + " " + d.desc + " " + d.props.map(p => p[0] + " " + p[1] + " " + p[3]).join(" ")).toLowerCase();
  card.dataset.search = haystack;

  let propsHtml = "";
  if (d.props.length) {
    propsHtml = `<table><thead><tr><th>Name</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>` +
      d.props.map(p => {
        const key = exampleKey(d.name, p[0]);
        const hasEx = !!EXAMPLES[key];
        const nameCell = hasEx
          ? `<td class="name" role="button" tabindex="0" data-ex="${key}"><code>${escapeHtml(p[0])}</code></td>`
          : `<td class="name"><code>${escapeHtml(p[0])}</code></td>`;
        return `<tr class="prop-row${hasEx ? ' has-example' : ''}" data-p="${escapeHtml((p[0]+' '+p[3]).toLowerCase())}">
        ${nameCell}
        <td class="type"><code>${escapeHtml(p[1])}</code></td>
        <td class="def"><code>${escapeHtml(p[2])}</code></td>
        <td>${escapeHtml(p[3])}</td></tr>`;
      }).join("") +
      `</tbody></table>`;
  } else {
    propsHtml = `<p class="hint">No props.</p>`;
  }

  // Whole-component live example (Ink UI): keyed by the bare component name.
  const base = d.name.replace(/[<>()]/g, "").trim();
  const compExample = EXAMPLES[base] ? `
    <div class="comp-example">
      <button class="ex-toggle" data-ex="${base}" aria-expanded="false">▶ live example</button>
      <div class="comp-example-body" hidden></div>
    </div>` : "";

  card.innerHTML = `
    <h2><code>${escapeHtml(d.name)}</code><span class="tag ${d.kind}">${d.kind}</span></h2>
    <code class="sig">${escapeHtml(d.import)}</code>
    <code class="sig">${escapeHtml(d.sig)}</code>
    <p class="desc">${escapeHtml(d.desc)}</p>
    ${compExample}
    ${propsHtml}`;
  cards.appendChild(card);
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

// ── Live examples: snippet + rendered terminal output ──
// Per-prop (Box/Text) examples expand as a table row; whole-component (Ink UI)
// examples expand under a "▶ live example" button. Both share this markup.
function exampleInner(ex) {
  const output = ex.html
    ? `<pre class="term">${ex.html}</pre>`
    : `<pre class="term"><span class="note">${escapeHtml(ex.note || "▶ interactive — run it to see this.")}</span></pre>`;
  const note = ex.html && ex.note ? `<span class="example-note">${escapeHtml(ex.note)}</span>` : "";
  return `<div class="example-wrap">
      <div class="example-col grow">
        <span class="example-label">Snippet</span>
        <pre class="example-snippet">${escapeHtml(ex.code)}</pre>
      </div>
      <div class="example-col">
        <span class="example-label">Terminal output</span>
        ${output}${note}
      </div>
    </div>`;
}

function collapseAllExamples() {
  cards.querySelectorAll(".example-row").forEach(r => r.remove());
  cards.querySelectorAll(".prop-row.open").forEach(r => r.classList.remove("open"));
  cards.querySelectorAll(".ex-toggle.open").forEach(btn => {
    btn.classList.remove("open"); btn.setAttribute("aria-expanded", "false");
    const body = btn.nextElementSibling;
    if (body) { body.hidden = true; body.innerHTML = ""; }
  });
}

function toggleExample(cell) {                          // per-prop, expands a table row
  const row = cell.closest(".prop-row");
  const ex = EXAMPLES[cell.dataset.ex];
  if (!row || !ex) return;
  if (row.classList.contains("open")) {                 // already open → collapse
    const next = row.nextElementSibling;
    if (next && next.classList.contains("example-row")) next.remove();
    row.classList.remove("open");
    return;
  }
  const exRow = document.createElement("tr");
  exRow.className = "example-row";
  exRow.innerHTML = `<td colspan="4">${exampleInner(ex)}</td>`;
  row.after(exRow);
  row.classList.add("open");
}

function toggleCompExample(btn) {                        // whole-component, expands under the button
  const ex = EXAMPLES[btn.dataset.ex];
  const body = btn.nextElementSibling;
  if (!ex || !body) return;
  const open = btn.getAttribute("aria-expanded") === "true";
  if (open) { body.hidden = true; body.innerHTML = ""; }
  else { body.innerHTML = exampleInner(ex); body.hidden = false; }
  btn.setAttribute("aria-expanded", String(!open));
  btn.classList.toggle("open", !open);
}

cards.addEventListener("click", e => {
  const btn = e.target.closest(".ex-toggle");
  if (btn) { toggleCompExample(btn); return; }
  const cell = e.target.closest(".prop-row.has-example td.name");
  if (cell) toggleExample(cell);
});
cards.addEventListener("keydown", e => {                // <button> handles Enter/Space natively
  if (e.key !== "Enter" && e.key !== " ") return;
  const cell = e.target.closest(".prop-row.has-example td.name");
  if (!cell) return;
  e.preventDefault();
  toggleExample(cell);
});

// ── Live search ──
const search = document.getElementById("search");
const noResults = document.getElementById("noResults");
const navLinks = [...nav.querySelectorAll("a")];
const cardEls = [...cards.querySelectorAll(".card")];

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  collapseAllExamples();   // avoid expansion rows orphaned next to filtered-out props
  let visible = 0;
  for (const card of cardEls) {
    const rows = [...card.querySelectorAll(".prop-row")];
    let cardMatch = !q || card.dataset.search.includes(q);
    if (q && rows.length) {
      let anyRow = false;
      for (const r of rows) {
        const m = r.dataset.p.includes(q);
        r.classList.toggle("hidden", q && !cardMatch && !m);
        if (m) anyRow = true;
      }
      cardMatch = cardMatch || anyRow;
      if (cardMatch) rows.forEach(r => { if (card.dataset.search.includes(q)) r.classList.remove("hidden"); });
    } else {
      rows.forEach(r => r.classList.remove("hidden"));
    }
    card.classList.toggle("hidden", !cardMatch);
    if (cardMatch) visible++;
  }
  for (const a of navLinks) a.classList.toggle("hidden", q && !a.dataset.key.includes(q) &&
    !cardEls.find(c => c.id === a.getAttribute("href").slice(1) && !c.classList.contains("hidden")));
  noResults.style.display = visible ? "none" : "block";
});
</script>
</body>
</html>
